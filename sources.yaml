# 岩手県内33市町村の取得元一覧
#
# 各自治体の sources に取得元を並べます（複数可。記事URLで重複を除きます）。
#   type: rss     … RSS / Atom フィード
#   type: scrape  … RSSのないサイト。ページ内の日付の直後にある最初のリンクを記事とみなす
#     date_format: dotted  … 「2026.10.15」形式
#     date_format: reiwa   … 「令和8年 10月15日」形式
#     selector: (任意) 記事一覧部分のCSSセレクタ。指定するとその範囲だけを走査
#
# sources が空の自治体はページに「取得元未設定」と表示されます。

municipalities:
  # ---- 市 ----
  - name: 盛岡市
    sources:
      - type: rss
        url: https://www.city.morioka.iwate.jp/news.rss
  - name: 宮古市
    sources:
      - type: rss
        url: https://www.city.miyako.iwate.jp/cgi-bin/feed.php?siteNew=1
